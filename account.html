<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booyah Store - Mon Compte</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { margin: 0; padding: 0; font-family: 'Rajdhani', sans-serif; background: #000b1e; color: white; text-align: center; min-height: 100vh; transition: 0.3s; }
        .main-wrapper { width: 100%; max-width: 600px; padding: 20px; box-sizing: border-box; margin: 0 auto; }
        .header-container { display: flex; align-items: center; border-top: 2px solid #00d4ff; padding: 15px 20px; gap: 15px; }
        .logo-img { width: 35px; height: 35px; border-radius: 8px; object-fit: cover; }
        .brand-text { font-family: 'Orbitron', sans-serif; font-weight: 900; text-transform: uppercase; font-size: 1rem; }
        
        .profile-card { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(0, 212, 255, 0.3); border-radius: 20px; padding: 30px; margin-top: 30px; box-shadow: 0 0 20px rgba(0, 212, 255, 0.1); }
        .avatar-large { width: 80px; height: 80px; border-radius: 50%; border: 3px solid #00d4ff; margin-bottom: 15px; }
        .balance-box { background: rgba(0, 255, 136, 0.1); border: 1px solid #00ff88; padding: 15px; border-radius: 15px; margin-top: 20px; }
        .balance-amount { font-size: 1.5rem; font-weight: 900; color: #00ff88; }

        .bottom-nav-container { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 450px; }
        .nav-cage { background: #ffffff; border-radius: 25px; display: flex; justify-content: space-around; padding: 10px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
        .nav-item { flex: 1; color: #000; text-decoration: none; font-size: 0.7rem; font-weight: 900; display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer; }
        .nav-item.active { color: #00d4ff; }
        .nav-item:active {
            transform: scale(0.9); /* Mietsika kely rehefa kitiana */
        }

        #pageLoader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000b1e; z-index: 10000; display: none; flex-direction: column; align-items: center; justify-content: center; color: #00d4ff; font-family: 'Orbitron'; }
        .loader-spinner { width: 50px; height: 50px; border: 5px solid rgba(0, 212, 255, 0.2); border-top: 5px solid #00d4ff; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
        .fade-out { animation: fadeOut 0.3s forwards; }
    </style>
</head>
<body>
    <div id="pageLoader"><div class="loader-spinner"></div><div style="letter-spacing: 3px; font-size: 0.8rem;">CHARGEMENT...</div></div>

    <div class="main-wrapper">
        <div class="header-container">
            <img src="logo.jpg" class="logo-img">
            <div style="display: flex; flex-direction: column; align-items: flex-start; flex-grow: 1;">
                <div class="brand-text"><span style="color: #007bff;">BOOYAH</span> <span style="color: #ffc107;">STORE</span></div>
            </div>
        </div>

        <div class="profile-card">
            <img src="logo.jpg" class="avatar-large">
            <h2 id="userName" style="margin: 0; font-family: 'Orbitron';">USER_BOOYAH</h2>
            <p id="userUid" style="color: #888; margin-top: 5px;">UID: 00000000</p>
            
            <div class="balance-box">
                <div style="font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px;">Solde Actuel</div>
                <div class="balance-amount" id="userBalance">0 Ar</div>
            </div>

            <button onclick="logout()" style="margin-top: 30px; background: transparent; border: 1px solid #ff4444; color: #ff4444; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-family: 'Orbitron'; font-size: 0.7rem;">DECONNEXION</button>
        </div>
    </div>

    <div class="bottom-nav-container">
        <div class="nav-cage">
            <div class="nav-item" onclick="navigateTo('index.html')"><i class="fa-solid fa-house"></i><span>HOME</span></div>
            <div style="width:1px; height:25px; background:#eee;"></div>
            <div class="nav-item" onclick="navigateTo('index.html')"><i class="fa-solid fa-clock-rotate-left"></i><span>HISTORY</span></div>
            <div style="width:1px; height:25px; background:#eee;"></div>
            <div class="nav-item active"><i class="fa-solid fa-user"></i><span>ACCOUNT</span></div>
            <div style="width:1px; height:25px; background:#eee;"></div>
            <div class="nav-item" onclick="window.open('https://wa.me/261322223128')"><i class="fa-solid fa-circle-question"></i><span>HELP</span></div>
        </div>
    </div>

    <script type="module">
        import { supabase } from './supabaseClient.js'
        
        async function loadProfile() {
            const uid = localStorage.getItem('userUid') || 'Non défini';
            const pseudo = localStorage.getItem('userPseudo') || 'Utilisateur';
            document.getElementById('userUid').innerText = "UID: " + uid;
            document.getElementById('userName').innerText = pseudo.toUpperCase();

            const { data: { user } } = await supabase.auth.getUser();
            if (user) {
                const { data } = await supabase.from('profiles').select('balance').eq('id', user.id).single();
                if (data) document.getElementById('userBalance').innerText = data.balance.toLocaleString() + " Ar";
            }
        }
        loadProfile();

        window.addEventListener('DOMContentLoaded', () => {
            // Afenina ny loader
            document.getElementById('pageLoader').style.display = 'none';
        });

        window.logout = async () => {
            await supabase.auth.signOut();
            localStorage.clear();
            navigateTo('login.html');
        }
    </script>
    <script>
        function navigateTo(url) {
            document.getElementById('pageLoader').style.display = 'flex';
            document.body.classList.add('fade-out');
            setTimeout(() => { window.location.href = url; }, 500);
        }
    </script>
</body>
</html>
